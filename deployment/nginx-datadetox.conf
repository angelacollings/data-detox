# Data Detox directives for a SiteHost Nginx web container.
#
# Merge these directives into the EXISTING server block in:
# /container/config/nginx/sites-available/default
#
# Do not replace SiteHost's existing listen, PHP/FastCGI, logging, or include
# directives. SiteHost terminates HTTPS at its reverse proxy, so HTTPS must be
# detected through X-Forwarded-Proto rather than a local port 443 server block.

# Canonical hostname: redirect www on both HTTP and HTTPS.
if ($host = www.datadetox.co.nz) {
    return 301 https://datadetox.co.nz$request_uri;
}

# SiteHost's documented HTTPS redirect for Nginx web containers.
if ($http_x_forwarded_proto != 'https') {
    rewrite ^ https://datadetox.co.nz$request_uri? permanent;
}

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'sha256-6t9m8igawNDg5a6xpr8TDG9J4UGaHBClQhrMTGhnSN8='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;

# Block dotfiles while allowing certificate validation paths.
location ~ /\.(?!well-known/) {
    deny all;
}

location = /robots.txt {
    try_files /robots.txt =404;
}

location = /sitemap.xml {
    try_files /sitemap.xml =404;
}

# Vite content-hashed files can be cached by browsers and SiteHost's optional
# proxy cache for one year.
location /assets/ {
    try_files $uri =404;
    expires 1y;
}

# Generated page directories are served directly; unknown React routes fall
# back to the homepage application.
location / {
    try_files $uri $uri/ /index.html;
}
